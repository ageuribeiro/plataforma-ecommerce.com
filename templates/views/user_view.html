{% extends "templates/layout.html" %}
{% block content %}

    <h1>Usuários</h1>
    <ul>
        {% for user in usuarios %}
        <li>{{user.nome}} - {{user.email}}</li>
        {% endfor %}
    </ul>

    <form action="/usuarios" method="POST">
        <label for="name">
        <input type="text" name="nome" placeholder="Insert your fullname">
    </form>
